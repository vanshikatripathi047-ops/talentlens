services:
  postgres:
    image: postgres:17
    container_name: talentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens_dev_password
      POSTGRES_DB: talentlens_dev
    ports:
      - "5432:5432"
    volumes:
      - talentlens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens -d talentlens_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  talentlens_postgres_data: